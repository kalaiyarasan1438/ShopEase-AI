spring:
  application:
    name: shopeasy-backend
  config:
    import: optional:file:.env

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}        # use 'validate' in production
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:dGhlLXF1aWNrLWJyb3duLWZveC1qdW1wcy1vdmVyLXRoZS1sYXp5LWRvZw==}
  access-token-expiry-ms:  86400000    # 24 hours
  refresh-token-expiry-ms: 604800000   # 7 days

# ── CORS ──────────────────────────────────────────────────────────
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:3000}

# ── AI Service ────────────────────────────────────────────────────
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}

# ── Google OAuth ──────────────────────────────────────────────────
google:
  client-id: ${GOOGLE_CLIENT_ID:680459965565-ieft2jign3ci8qnd9dqf4jbrs7dcpidm.apps.googleusercontent.com}

# ── Pagination Defaults ───────────────────────────────────────────
app:
  pagination:
    default-page-size: 12
    max-page-size: 50

# ── Swagger / OpenAPI ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ── Logging ───────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.shopeasy: DEBUG
    org.springframework.security: INFO
